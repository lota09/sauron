; MCP 앞단 Caddy(HTTPS) — sauron 그룹 밖의 공용 기반(다른 서비스의 HTTPS도 맡을 수 있음).
; MCP 서버 자체는 deploy.py [7]이 sauron.conf에 sauron:mcp 로 등록한다.
; 설치: sudo cp mcp/deploy/caddy-mcp.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update

[program:caddy-mcp]
; 외부 443 → (공유기) → 8443 → 127.0.0.1:8765. 인증서는 ~/.local/share/caddy
command=/usr/bin/caddy run --config /home/n20u/.caddy/Caddyfile
directory=/home/n20u
user=n20u
environment=HOME="/home/n20u"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/caddy-mcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
